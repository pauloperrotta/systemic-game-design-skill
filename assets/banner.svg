<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">systemic-game-design</title>
  <desc id="d">A Claude skill for designing, analyzing and balancing games as systems of loops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#17143a"/>
      <stop offset="1" stop-color="#2a1550"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrR" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#fb923c"/>
    </marker>
    <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#38bdf8"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>

  <!-- loop icon -->
  <g transform="translate(190 160)">
    <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    <path d="M-80,-30 A86,86 0 0 1 60,-62" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round" marker-end="url(#arrR)"/>
    <path d="M80,30 A86,86 0 0 1 -60,62" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" marker-end="url(#arrB)"/>
    <circle cx="-86" cy="-26" r="22" fill="#fb923c"/>
    <text x="-86" y="-18" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1020">R</text>
    <circle cx="86" cy="26" r="22" fill="#38bdf8"/>
    <text x="86" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1020">B</text>
    <circle r="26" fill="url(#ring)"/>
    <circle r="14" fill="#0b1020"/>
  </g>

  <!-- text -->
  <text x="340" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)">systemic-game-design</text>
  <text x="342" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#cbd5e1">Design · Analyze · Balance — games as systems of loops</text>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="342" y="228" width="150" height="38" rx="19" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-opacity="0.6"/>
    <text x="417" y="253" text-anchor="middle" fill="#fdba74">Claude skill</text>
    <rect x="504" y="228" width="170" height="38" rx="19" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="589" y="253" text-anchor="middle" fill="#7dd3fc">Systems thinking</text>
    <rect x="686" y="228" width="190" height="38" rx="19" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="781" y="253" text-anchor="middle" fill="#c4b5fd">Numbers you can check</text>
  </g>
</svg>
